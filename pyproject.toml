[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zettaranc-skill"
version = "3.6.0"
description = "zettaranc（万千）的思维框架与量化工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "zettaranc-skill contributors"}
]
keywords = ["trading", "quantitative", "tushare", "technical-indicators", "bili"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "tushare>=1.4.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
corpus = [
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# zt-web 这个 entry point 一直缺声明：装完 pip install -e . 直接跑必然 ImportError
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.0.0",
]
# 高阶行情数据层（modules/advanced_data.py），不装也不影响主流程：
# 取不到数时返回 None 并在 last_error 里提示 pip install akshare
advanced = [
    "akshare>=1.18.0",
]

[project.scripts]
zt = "modules.cli:main"
zt-web = "api.main:start_web"
zt-monitor = "modules.monitor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]
exclude = ["tests*", "scripts*", "corpus*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: 慢速端到端测试，默认不在常规 CI 中跑",
]
# 只把 modules.advanced_data 自己触发的 FutureWarning 升成错误（第四段是模块名正则，
# 匹配的是发出告警那一帧的 __name__）。这不是为了消噪音：read_json 的
# `to_datetime(..., unit=...)` 那句 FutureWarning 一旦在别处被 -W error 升成异常，就会被
# _cache_get 的兜底 except 吞成"缓存没命中"，于是每次 fetch 都去打上游、缓存全程失效。
# 缺了这一条，把 _decode_payload 的 convert_axes 改回 True 全库照样绿（实测）。
# **只针对本模块**：全仓库还有别的库在发 FutureWarning，一刀切会炸掉不相干的测试。
filterwarnings = [
    "error::FutureWarning:modules.advanced_data",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data/", "logs/", "knowledge/"]

[tool.ruff.lint]
select = ["F", "E", "W", "UP"]
ignore = ["E501", "F401", "F403"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["modules"]
omit = [
    "modules/__init__.py",
    "tests/*",
    "scripts/*",
    "docs/archive/corpus/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 1
fail_under = 0

[tool.coverage.html]
directory = "htmlcov"
